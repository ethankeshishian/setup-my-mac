# Reload window
unbind r
bind r source-file ~/.tmux.conf

# Leader
set -g prefix C-s

set -g mouse on
set-option -g status-position top

# # Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-window on

# Neovim navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# # Neovim navigation (note that arrow keys are defined by default)
bind-key -r Left select-pane -L
bind-key -r Down select-pane -D
bind-key -r Up select-pane -U
bind-key -r Right select-pane -R

# # tmux navigation
set -g @vim_navigator_mapping_left "C-Left"
set -g @vim_navigator_mapping_right "C-Right"
set -g @vim_navigator_mapping_up "C-Up"
set -g @vim_navigator_mapping_down "C-Down"

bind C-p previous-window
bind C-n next-window

# Plugins:
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#latest'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize tpm
run '$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm'

# Theme
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# Should be at the bottom
run '~/.tmux/plugins/tpm/tpm'

